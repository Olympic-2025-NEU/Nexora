name: nexora-p00-spike

# Disposable research stack. It is not the Nexora deployment topology.
services:
  upstream:
    image: python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
    command: python /spike/upstream.py
    volumes:
      - ./upstream.py:/spike/upstream.py:ro

  core-db:
    image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    environment:
      POSTGRES_DB: core_spike
      POSTGRES_USER: core_spike
      POSTGRES_PASSWORD: ${P00_CORE_DB_PASSWORD}
    volumes:
      - core_spike_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U core_spike -d core_spike]
      interval: 3s
      timeout: 2s
      retries: 30

  core:
    image: nexora-p00-core-spike:p00-t03
    build:
      context: .
      dockerfile: Dockerfile.core
    depends_on:
      core-db:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      P00_CORE_DB_PASSWORD: ${P00_CORE_DB_PASSWORD}

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${P00_KC_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${P00_KC_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./generated/realm.json:/opt/keycloak/data/import/nexora-p00-realm.json:ro
    ports:
      - 127.0.0.1:18080:8080

  apisix:
    image: apache/apisix:3.20.0-debian@sha256:013de62a9dfba7d8e6006b3e85b524c28c9f1c3549fca3b91d5b258b0b9e759a
    depends_on:
      - upstream
      - keycloak
      - core
    volumes:
      - ./apisix-config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./generated/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - 127.0.0.1:19080:9080

  seaweed:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${P00_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${P00_S3_SECRET_KEY}
      S3_BUCKET: ${P00_S3_BUCKET}
    volumes:
      - seaweed_data:/data
    ports:
      - 127.0.0.1:18333:8333

  flowable-db:
    image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
    environment:
      POSTGRES_DB: flowable
      POSTGRES_USER: flowable
      POSTGRES_PASSWORD: ${P00_FLOWABLE_DB_PASSWORD}
    volumes:
      - flowable_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U flowable -d flowable]
      interval: 3s
      timeout: 2s
      retries: 30

  flowable:
    image: flowable/flowable-rest:8.0.0@sha256:708dfa32f27b93180bb6e7a30684d881d995fe257f5b8413e14b20a55c25672d
    depends_on:
      flowable-db:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://flowable-db:5432/flowable
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: ${P00_FLOWABLE_DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.postgresql.Driver
      FLOWABLE_REST_APP_ADMIN_USER_ID: ${P00_FLOWABLE_ADMIN_USER_ID}
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${P00_FLOWABLE_ADMIN_PASSWORD}
      FLOWABLE_REST_APP_CREATE_DEMO_DEFINITIONS: "false"
      REST_VARIABLES_ALLOW_SERIALIZABLE: "false"
    ports:
      - 127.0.0.1:18082:8080

volumes:
  core_spike_data:
  seaweed_data:
  flowable_data:
