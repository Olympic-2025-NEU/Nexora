openapi: 3.0.3
info:
  title: Nexora API
  version: 1.0.0
  description: "Nexora ERP API v1. P02-T07: Bearer security schemes (bearerUser, bearerM2M, oidc). Operations describe target behavior; runtime conformance tested per phase. See deploy/README.md for provisioning runbook."
  license:
    name: AGPL-3.0-only
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: https://{host}
    variables:
      host:
        default: nexora.example
tags:
  - name: Platform
    description: Platform target contract
  - name: Core
    description: Core target contract
  - name: M01
    description: M01 target contract
  - name: M02
    description: M02 target contract
  - name: M03
    description: M03 target contract
  - name: M04
    description: M04 target contract
  - name: AI01
    description: AI01 target contract
  - name: Operations
    description: Operations target contract
paths:
  /api/v1/health/live:
    get:
      tags:
        - Platform
      operationId: getHealthLive
      summary: Liveness
      description: Target contract; runtime implementation is tracked by the owning phase.
      security: []
      x-nexora-roles: []
      x-nexora-scope: anonymous
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "429":
          $ref: "#/components/responses/Error"
  /api/v1/health/ready:
    get:
