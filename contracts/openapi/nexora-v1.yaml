            type: object
            additionalProperties: false
            required:
              - issuerInstanceId
              - eventId
            properties:
              issuerInstanceId:
                type: string
                minLength: 1
                maxLength: 64
              eventId:
                type: string
                format: uuid
          minItems: 1
          maxItems: 100
        disclosureScope:
          type: string
          enum:
            - partner
            - public
