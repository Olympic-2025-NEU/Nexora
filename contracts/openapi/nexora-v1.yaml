components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://keycloak.example/.well-known/openid-configuration
      description: Authorization Code + PKCE. MFA required for administrator and approver roles.
    bearerUser:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "User Bearer JWT. Audience: OIDC_AUDIENCE (erp-browser). Issued via auth-code+PKCE."
    bearerM2M:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Service-account Bearer JWT for M2M partner federation. Required scope: federation:write."
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      description: Current aggregate version ETag.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Stable across retries; reuse with different payload returns 409.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    ErrorBody:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - field
              - reason
            properties:
              field:
                type: string
              reason:
                type: string
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        service:
          type: string
        version:
          type: string
    Page:
      type: object
      additionalProperties: false
      required:
        - limit
      properties:
        nextCursor:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 100
    Me:
      type: object
      additionalProperties: false
      required:
        - sub
        - displayName
        - role
        - status
        - warehouseIds
      properties:
        sub:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum:
            - administrator
            - staff
            - approver
            - viewer
        status:
          type: string
        warehouseIds:
          type: array
          items:
            type: string
            format: uuid
    Organization:
      type: object
      additionalProperties: false
      required:
        - id
        - instanceId
        - code
        - name
        - timezone
        - status
        - version
      properties:
        id:
          type: string
          format: uuid
        instanceId:
          type: string
        code:
          type: string
        name:
          type: string
        timezone:
          type: string
        status:
          type: string
        version:
          type: integer
          minimum: 1
        contactEmail:
          type: string
          format: email
    OrganizationPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        contactEmail:
          type: string
          format: email
        timezone:
          type: string
      minProperties: 1
    Member:
      type: object
      additionalProperties: false
      required:
        - id
        - keycloakSub
        - displayName
        - role
        - status
        - version
      properties:
        id:
          type: string
          format: uuid
        keycloakSub:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - administrator
            - staff
            - approver
            - viewer
        status:
          type: string
        warehouseIds:
          type: array
          items:
            type: string
            format: uuid
        version:
          type: integer
          minimum: 1
    MemberCreate:
      type: object
      additionalProperties: false
      required:
        - keycloakSub
        - displayName
        - role
      properties:
        keycloakSub:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - administrator
            - staff
            - approver
            - viewer
        warehouseIds:
          type: array
          items:
            type: string
            format: uuid
    MemberPatch:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum:
            - administrator
            - staff
            - approver
            - viewer
        status:
          type: string
          enum:
            - active
            - disabled
        warehouseIds:
          type: array
          items:
            type: string
            format: uuid
      minProperties: 1
    Partner:
      type: object
      additionalProperties: false
      required:
        - id
        - issuerInstanceId
        - code
        - displayName
        - status
        - version
      properties:
        id:
          type: string
          format: uuid
        issuerInstanceId:
          type: string
        code:
          type: string
        displayName:
          type: string
        contactEmail:
          type: string
          format: email
        status:
          type: string
        connectionStatus:
          type: string
        version:
          type: integer
          minimum: 1
    PartnerCreate:
      type: object
      additionalProperties: false
      required:
        - issuerInstanceId
        - code
        - displayName
      properties:
        issuerInstanceId:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        contactEmail:
          type: string
          format: email
    PartnerPatch:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - active
            - suspended
        contactEmail:
          type: string
          format: email
      minProperties: 1
    PartnerConnectionInput:
      type: object
      additionalProperties: false
      required:
        - endpointUrl
        - outboundTokenUrl
        - outboundClientId
        - outboundSecretRef
        - outboundAudience
