components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: "https://keycloak.example/.well-known/openid-configuration"
    bearerM2M:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessEnvelope:
      type: object
      required:
        - data
        - requestId
      properties:
        data:

        requestId:
          type: string
        page:
          type: object
          properties:
            nextCursor:
              type: string
              nullable: true
            limit:
              type: integer
    ErrorBody:
      type: object
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              reason:
                type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
    GenericData:
      type: object
      additionalProperties: true
      x-nexora-comment: fill-from-payloads
    GenericWrite:
      type: object
      additionalProperties: true
      x-nexora-comment: fill-from-payloads
    EmptyObject:
      type: object
      additionalProperties: false
    OrganizationPatch:
      type: object
      properties:
        name:
          type: string
        contactEmail:
          type: string
        timezone:
          type: string
    PartnerConnection:
      type: object
      required:
        - endpointUrl
        - outboundTokenUrl
        - outboundClientId
        - outboundSecretRef
        - outboundAudience
        - inboundClientId
        - allowedInboundScope
      properties:
        endpointUrl:
          type: string
          format: uri
        outboundTokenUrl:
          type: string
          format: uri
        outboundClientId:
          type: string
        outboundSecretRef:
          type: string
        outboundAudience:
          type: string
        inboundClientId:
          type: string
        allowedInboundScope:
          type: string
    ApprovalDecision:
      type: object
      required:
        - decision
      properties:
        decision:
          enum:
            - approved
            - rejected
        reason:
          type: string
    QrCreate:
      type: object
      required:
        - policyVersion
      properties:
        policyVersion:
          type: string
    PassportPublic:
      type: object
      properties:
        productName:
          type: string
        publicLotCode:
          type: string
        originIssuer:
          type: string
        timeline:
          type: array
          items:
            type: object
        verificationState:
          type: string
        gaps:
          type: array
          items:
            type: object
        asOf:
          type: string
          format: date-time
    FederationEnvelope:
      type: object
      description: See contracts/events/envelope-v1.schema.json
      additionalProperties: true
    FederationAck:
      type: object
      required:
        - messageId
        - ackId
        - acceptedAt
        - status
      properties:
        messageId:
          type: string
          format: uuid
        ackId:
          type: string
          format: uuid
        acceptedAt:
          type: string
          format: date-time
        status:
          enum:
            - validated
            - pending_dependency
    RetryReason:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
    AiChat:
      type: object
      required:
        - message
      properties:
        message:
          type: string
        conversationId:
          type: string
          format: uuid
        lotRef:
          type: string
    AiDraft:
      type: object
      required:
        - documentType
        - instruction
      properties:
        documentType:
          enum:
            - goods_receipt
            - goods_issue
        instruction:
          type: string
        purpose:
          enum:
            - partner_transfer
            - sale
            - other
        proposedFields:
          type: object
    CoreRecordCreate:
      type: object
      required:
        - kind
        - payload
        - visibility
        - policyVersion
      properties:
        kind:
          enum:
            - evidence_metadata
            - trace_projection
            - ot_reading
            - archive_manifest
        sourceType:
          type: string
        sourceId:
          type: string
        payload:
          type: object
        visibility:
          type: string
        policyVersion:
          type: string
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: #/components/schemas/ErrorBody
