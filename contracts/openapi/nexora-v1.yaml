components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://keycloak.example/.well-known/openid-configuration
      description: Authorization Code + PKCE. MFA required for administrator and approver roles.
    bearerUser:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "User Bearer JWT. Audience: OIDC_AUDIENCE (erp-browser). Issued via auth-code+PKCE."
    bearerM2M:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Service-account Bearer JWT for M2M partner federation. Required scope: federation:write."
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      description: Current aggregate version ETag.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
      description: Stable across retries; reuse with different payload returns 409.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorBody"
  schemas:
    ErrorBody:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - field
              - reason
            properties:
              field:
                type: string
              reason:
                type: string
    HealthStatus:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          enum:
            - ok
            - degraded
        service:
          type: string
        version:
          type: string
    Page:
      type: object
      additionalProperties: false
      required:
        - limit
      properties:
        nextCursor:
          type: string
        limit:
          type: integer
          minimum: 1
          maximum: 100
    Me:
      type: object
      additionalProperties: false
      required:
        - userId
        - organizationId
        - roles
        - unitIds
        - displayName
      properties:
        userId:
          type: string
        organizationId:
          type: string
          format: uuid
        roles:
          type: array
          items:
            type: string
            enum:
              - administrator
              - staff
              - approver
              - viewer
        unitIds:
          type: array
          items:
            type: string
            format: uuid
        displayName:
          type: string
    Organization:
      type: object
      additionalProperties: false
      required:
        - id
        - instanceId
        - code
        - name
        - timezone
        - status
        - version
      properties:
        id:
          type: string
          format: uuid
        instanceId:
          type: string
        code:
          type: string
        name:
          type: string
        timezone:
          type: string
        status:
          type: string
        version:
          type: integer
          minimum: 1
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
        address:
          type: string
    OrganizationPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        contactEmail:
          type: string
          format: email
          nullable: true
        contactPhone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        timezone:
          type: string
        version:
          type: integer
          minimum: 1
      minProperties: 1
    Member:
      type: object
      additionalProperties: false
      required:
        - id
        - keycloakSub
        - displayName
        - role
        - status
        - version
      properties:
        id:
          type: string
          format: uuid
        keycloakSub:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - administrator
            - staff
            - approver
            - viewer
        status:
          type: string
        warehouseIds:
          type: array
          items:
            type: string
            format: uuid
        version:
          type: integer
          minimum: 1
        provisionalPassword:
          type: string
          description: Present only on invite response; never persisted for later GET.
        keycloakCreated:
          type: boolean
    MemberCreate:
      type: object
      additionalProperties: false
      required:
        - username
        - displayName
        - role
      properties:
        username:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        role:
          type: string
          enum:
            - administrator
            - staff
            - approver
            - viewer
        warehouseIds:
          type: array
          items:
            type: string
            format: uuid
        temporaryPassword:
          type: string
          minLength: 8
      description: Admin invite provisions (or reuses) a Keycloak user by username. Clients must not send keycloakSub — the IdP allocates or resolves the subject.
    MemberPatch:
      type: object
      additionalProperties: false
      properties:
        role:
          type: string
          enum:
            - administrator
            - staff
            - approver
            - viewer
        status:
          type: string
          enum:
            - active
            - disabled
        displayName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          nullable: true
        warehouseIds:
          type: array
          items:
            type: string
            format: uuid
        version:
          type: integer
          minimum: 1
      minProperties: 1
    Partner:
      type: object
      additionalProperties: false
      required:
        - id
        - issuerInstanceId
        - code
        - displayName
        - status
        - version
      properties:
        id:
          type: string
          format: uuid
        issuerInstanceId:
          type: string
        code:
          type: string
        displayName:
          type: string
        contactEmail:
          type: string
          format: email
        status:
          type: string
        connectionStatus:
          type: string
        version:
          type: integer
          minimum: 1
    PartnerCreate:
      type: object
      additionalProperties: false
      required:
        - issuerInstanceId
        - code
        - displayName
      properties:
        issuerInstanceId:
          type: string
          minLength: 1
        code:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        contactEmail:
          type: string
          format: email
    PartnerPatch:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - active
            - suspended
        contactEmail:
          type: string
          format: email
          nullable: true
        version:
          type: integer
          minimum: 1
      minProperties: 1
    PartnerConnectionInput:
      type: object
      additionalProperties: false
      required:
        - endpointUrl
        - outboundTokenUrl
        - outboundClientId
        - outboundSecretRef
        - outboundAudience
        - inboundClientId
        - allowedInboundScope
      properties:
        endpointUrl:
          type: string
          format: uri
          pattern: ^https://
        outboundTokenUrl:
          type: string
          format: uri
          pattern: ^https://
        outboundClientId:
          type: string
        outboundSecretRef:
          type: string
          description: Write-only secret reference; never returned by GET/PUT responses.
        outboundAudience:
          type: string
        inboundClientId:
          type: string
        allowedInboundScope:
          type: string
        status:
          type: string
          enum:
            - active
            - rotating
            - disabled
    PartnerConnectionView:
      type: object
      additionalProperties: false
      required:
        - partnerId
        - endpointHost
        - status
      properties:
        partnerId:
          type: string
          format: uuid
        endpointHost:
          type: string
        status:
          type: string
        rotatedAt:
          type: string
          format: date-time
      description: Safe connection metadata. outboundSecretRef is never included.
    Product:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - categoryId
        - isActive
        - version
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        categoryId:
          type: string
          format: uuid
        attributes:
          type: object
        isActive:
          type: boolean
        deletedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
    ProductCreate:
      type: object
      additionalProperties: false
      required:
        - name
        - categoryId
      properties:
        name:
          type: string
          minLength: 1
        categoryId:
          type: string
          format: uuid
        attributes:
          type: object
        sku:
          type: string
        barcode:
          type: string
    ProductPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
        categoryId:
          type: string
          format: uuid
        attributes:
          type: object
        isActive:
          type: boolean
      minProperties: 1
    ProductVariant:
      type: object
      additionalProperties: false
      required:
        - id
        - productId
        - isPrimary
        - isActive
        - version
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        sku:
          type: string
        barcode:
          type: string
        isPrimary:
