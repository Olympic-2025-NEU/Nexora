          type: string
          minLength: 1
          maxLength: 1000
        originLot:
          type: object
          additionalProperties: false
          required:
            - issuerInstanceId
            - lotId
          properties:
            issuerInstanceId:
              type: string
              minLength: 1
              maxLength: 64
            lotId:
              type: string
              format: uuid
        downstreamPartnerRef:
          type: string
          minLength: 1
          maxLength: 64
        impactType:
          type: string
          minLength: 1
          maxLength: 80
        sourceEventRefs:
          type: array
