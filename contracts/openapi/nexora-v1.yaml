                format: uuid
              checksum:
                type: string
                pattern: ^[0-9a-f]{64}$
              visibility:
                enum:
                  - partner
                  - public
        sharingPolicyVersion:
          type: string
          minLength: 1
        linkedIssueId:
          type: string
          format: uuid
        sentQuantity:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$
        sourceTransfer:
          type: object
          additionalProperties: false
          required:
            - issuerInstanceId
            - id
          properties:
            issuerInstanceId:
              type: string
              minLength: 1
              maxLength: 64
            id:
              type: string
              format: uuid
        actualLines:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - sourceLineId
              - receiverBatchId
              - sentQuantity
              - actualQuantity
              - unit
            properties:
              sourceLineId:
                type: string
                format: uuid
              receiverBatchId:
                type: string
                format: uuid
              sentQuantity:
                type: string
                pattern: ^(?!0(?:\.0{1,3})?$)(0|[1-9][0-9]*)(\.[0-9]{1,3})?$
              actualQuantity:
                type: string
                pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$
              unit:
                type: string
                enum:
                  - EA
                  - KG
                  - L
          minItems: 1
          maxItems: 100
        actualQuantity:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,3})?$
        discrepancyQuantity:
