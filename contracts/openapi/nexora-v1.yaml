                    minLength: 1
                    maxLength: 64
                  lotId:
                    type: string
                    format: uuid
              senderBatch:
                type: object
                additionalProperties: false
                required:
                  - instanceId
                  - batchId
                properties:
                  instanceId:
                    type: string
                    minLength: 1
                    maxLength: 64
                  batchId:
                    type: string
                    format: uuid
              product:
                type: object
                additionalProperties: false
                required:
