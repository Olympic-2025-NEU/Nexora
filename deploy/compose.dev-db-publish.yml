# Optional overlay: publish Postgres on loopback for host-side Prisma/tools.
# Prefer deploy/compose.local-admin.yml when you also need Keycloak Account on loopback
# (used by deploy/scripts/dev-up.*).
# Usage:
#   docker compose -f deploy/compose.yml -f deploy/compose.dev-db-publish.yml \
#     --env-file deploy/instances/a.env -p nexora up -d
# Do not use on shared/demo hosts exposed beyond the developer machine.

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
