# SPDX-License-Identifier: AGPL-3.0-only
# Nexora P01 — single Compose entrypoint (instances A/B/C via env file).
# Project/containers use prefix nexora- (e.g. nexora-postgres). Profiles: apps | core | dxlab | ai
# Host PG/Keycloak publish: -f deploy/compose.local-admin.yml (see deploy/scripts/dev-up.*)
# Use -p nexora-a|nexora-b|nexora-c for isolated Compose projects.
name: nexora

networks:
  edge:
  internal:

volumes:
  pg_data:
  redis_data:
  seaweed_data:
  seaweed_config:
  clamav_data:
  ollama_models:

services:
  postgres:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g

  db-bootstrap:
    image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
    entrypoint: ["sh", "/bootstrap.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_NAME: ${APP_DB_NAME}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      CORE_DB_USER: ${CORE_DB_USER}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      MIGRATOR_DB_USER: ${MIGRATOR_DB_USER}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME}
      FLOWABLE_DB_USER: ${FLOWABLE_DB_USER}
      FLOWABLE_DB_PASSWORD: ${FLOWABLE_DB_PASSWORD}
      FLOWABLE_DB_NAME: ${FLOWABLE_DB_NAME}
    volumes:
      - ./postgres/bootstrap.sh:/bootstrap.sh:ro,z
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  db-migrate:
    image: nexora-migrator:${NEXORA_IMAGE_TAG:-p09-local}
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrator
    environment:
      DATABASE_URL: ${MIGRATOR_DATABASE_URL}
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    networks: [internal]
    restart: "no"

  redis:
    image: redis:7.4-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    command: ["start-dev", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME: ${OIDC_FRONTEND_URL:-${OIDC_BASE_URL}}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: ${OIDC_BACKCHANNEL_DYNAMIC:-false}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    networks:
      internal:
        aliases:
          - keycloak-${INSTANCE_ID}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1g

  keycloak-bootstrap:
    image: node:22-bookworm-slim@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee
    command: ["node", "/bootstrap/bootstrap.mjs"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      OIDC_BASE_URL: ${OIDC_BASE_URL}
      OIDC_FRONTEND_URL: ${OIDC_FRONTEND_URL:-${OIDC_BASE_URL}}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_CLIENT_ID_ERP: ${OIDC_CLIENT_ID_ERP}
      OIDC_CLIENT_ID_DXLAB: ${OIDC_CLIENT_ID_DXLAB}
      OIDC_REDIRECT_URI_ERP: ${OIDC_REDIRECT_URI_ERP}
      OIDC_REDIRECT_URI_DXLAB: ${OIDC_REDIRECT_URI_DXLAB}
      OIDC_GATEWAY_CLIENT_ID: ${OIDC_GATEWAY_CLIENT_ID}
      OIDC_GATEWAY_CLIENT_SECRET: ${OIDC_GATEWAY_CLIENT_SECRET}
      KC_DEV_USERNAME: ${KC_DEV_USERNAME:-}
      KC_DEV_USER_PASSWORD: ${KC_DEV_USER_PASSWORD:-}
      KC_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-}
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-}
      KC_APPROVER_USERNAME: ${KC_APPROVER_USERNAME:-}
      KC_APPROVER_PASSWORD: ${KC_APPROVER_PASSWORD:-}
    volumes:
      - ./keycloak:/bootstrap:ro,z
    depends_on:
      keycloak:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  gateway:
    image: apache/apisix:3.20.0-debian@sha256:013de62a9dfba7d8e6006b3e85b524c28c9f1c3549fca3b91d5b258b0b9e759a
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro,z
      # Rendered from routes.yaml via deploy/scripts/render-apisix-routes.mjs (placeholders substituted).
      - ${APISIX_RENDERED_PATH:-./apisix/apisix.generated.yaml}:/usr/local/apisix/conf/apisix.yaml:ro,z
      # TLS certs (gitignored). Generate with scripts/gen-local-certs.ps1 / .sh
      # If certs are absent, the HTTP port still works for smoke tests.
      - ./certs:/usr/local/apisix/conf/certs:ro,z
    depends_on:
      keycloak-bootstrap:
        condition: service_completed_successfully
    networks: [edge, internal]
    ports:
      # HTTP — loopback only; kept for local smoke and redirect.
      - "127.0.0.1:${GATEWAY_HTTP_PORT:-19080}:9080"
      # HTTPS — loopback only (P02-T06). Requires certs in deploy/certs/.
      # If certs missing, gateway starts but SSL listener may fail silently.
      - "127.0.0.1:${GATEWAY_HTTPS_PORT:-19443}:9443"
    deploy:
      resources:
        limits:
          memory: 512m

  storage-bootstrap:
    image: node:22-bookworm-slim@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee
    command: ["node", "/bootstrap/bootstrap.mjs"]
    environment:
      S3_CORE_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_CORE_SECRET_KEY: ${S3_SECRET_KEY}
      S3_SCANNER_ACCESS_KEY: ${S3_SCANNER_ACCESS_KEY}
      S3_SCANNER_SECRET_KEY: ${S3_SCANNER_SECRET_KEY}
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE}
      S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}
    volumes:
      - ./seaweedfs:/bootstrap:ro,z
      - seaweed_config:/config
    networks: [internal]
    restart: "no"

  seaweedfs:
    image: chrislusf/seaweedfs:4.53@sha256:ccad23e18639c8b98cee17e7100b95830a06077b56d8e5b006d6dcf8ec5e94a0
    command: ["mini", "-dir=/data", "-ip.bind=0.0.0.0", "-s3.config=/config/s3.json", "-bucket=${S3_BUCKET_PRIVATE},${S3_BUCKET_QUARANTINE},${S3_BUCKET_PUBLIC}"]
    volumes:
      - seaweed_data:/data
      - seaweed_config:/config:ro
    depends_on:
      storage-bootstrap:
        condition: service_completed_successfully
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/status"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 512m

  flowable:
    image: flowable/flowable-rest:8.0.0@sha256:708dfa32f27b93180bb6e7a30684d881d995fe257f5b8413e14b20a55c25672d
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${FLOWABLE_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${FLOWABLE_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${FLOWABLE_DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.postgresql.Driver
      FLOWABLE_DATABASE_SCHEMA_UPDATE: "true"
      FLOWABLE_REST_APP_ADMIN_USER_ID: ${FLOWABLE_ADMIN_USER}
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD}
      FLOWABLE_REST_APP_CREATE_DEMO_DEFINITIONS: "false"
      REST_VARIABLES_ALLOW_SERIALIZABLE: "false"
    volumes:
      - ./flowable/processes:/process-definitions:ro,z
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    networks: [internal]
    ports:
      - "127.0.0.1:${FLOWABLE_HOST_PORT:?FLOWABLE_HOST_PORT required}:8080"
    healthcheck:
      test: ["CMD-SHELL", "auth=$$(printf '%s:%s' \"$$FLOWABLE_REST_APP_ADMIN_USER_ID\" \"$$FLOWABLE_REST_APP_ADMIN_PASSWORD\" | base64 -w0); wget -q -O /dev/null --header \"Authorization: Basic $$auth\" http://127.0.0.1:8080/flowable-rest/service/management/engine"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 1g

  clamav:
    image: clamav/clamav:1.4@sha256:4cc4350d3fded380caf1799e76c0d1c93f3fa40af99c0cb2862ec0c9b117718a
    volumes:
      - clamav_data:/var/lib/clamav
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 2g

  erp:
    profiles: ["apps"]
    image: nexora-erp:${NEXORA_IMAGE_TAG:-p09-local}
    build:
      context: ..
      dockerfile: Dockerfile
      target: runner
    environment:
      DATABASE_URL: ${APP_DATABASE_URL}
      CORE_DATABASE_URL: ${CORE_DATABASE_URL}
      INSTANCE_ID: ${INSTANCE_ID}
      NEXORA_ISSUER_INSTANCE_ID: nexora-${INSTANCE_ID}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_BASE_URL: ${OIDC_BASE_URL}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
      OIDC_CLIENT_ID_ERP: ${OIDC_CLIENT_ID_ERP}
      # ERP's actor-scoped AI orchestration talks only to the private adapter.
      # The same token is injected into ai; neither service depends on a model.
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_BASE_URL: ${AI_BASE_URL:-http://ai:8080}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      ALLOW_DEV_PASSWORD_LOGIN: ${ALLOW_DEV_PASSWORD_LOGIN:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      # Browser reset-password page links to Keycloak Account (needs local-admin publish).
      OIDC_ACCOUNT_URL: ${OIDC_ACCOUNT_URL:-}
      KEYCLOAK_HOST_PORT: ${KEYCLOAK_HOST_PORT:-}
      # Membership invite provisions users via Keycloak Admin (same creds as bootstrap).
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      FLOWABLE_BASE_URL: 
      FLOWABLE_ADMIN_USER: 
      FLOWABLE_ADMIN_PASSWORD: 
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 1g

  worker:
    profiles: ["apps"]
    image: nexora-erp:${NEXORA_IMAGE_TAG:-p09-local}
    build:
      context: ..
      dockerfile: Dockerfile
      target: runner
    command: ["node", "worker/entrypoint.js"]
    environment:
      DATABASE_URL: ${APP_DATABASE_URL}
      CORE_DATABASE_URL: ${CORE_DATABASE_URL}
      NEXORA_ISSUER_INSTANCE_ID: nexora-${INSTANCE_ID}
      FLOWABLE_BASE_URL: ${FLOWABLE_BASE_URL}
      REDIS_URL: ${REDIS_URL}
      FLOWABLE_ADMIN_USER: ${FLOWABLE_ADMIN_USER}
      FLOWABLE_ADMIN_PASSWORD: ${FLOWABLE_ADMIN_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE}
      S3_REGION: ${S3_REGION}
      # Local demo only: resolve env:PARTNER_OUTBOUND_CLIENT_SECRET in worker.
      # Production may mount secret:name at /run/secrets/name via an override.
      PARTNER_OUTBOUND_CLIENT_SECRET: ${PARTNER_OUTBOUND_CLIENT_SECRET:-}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 512m

  core-data:
    profiles: ["apps", "core"]
    image: nexora-core-data:${NEXORA_IMAGE_TAG:-p09-local}
    build:
      context: ..
      dockerfile: services/core-data/Dockerfile
    environment:
      CORE_DATABASE_URL: ${CORE_DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE}
      S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}
      S3_REGION: ${S3_REGION}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      clamav:
        condition: service_started
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 512m

  file-reconciler:
    profiles: ["apps", "core"]
    image: nexora-core-data:${NEXORA_IMAGE_TAG:-p09-local}
    build:
      context: ..
      dockerfile: services/core-data/Dockerfile
    command: ["node", "files/reconcile-job.mjs"]
    environment:
      CORE_DATABASE_URL: ${CORE_DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE}
      S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}
      S3_REGION: ${S3_REGION}
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 512m

  file-scanner:
    profiles: ["apps", "core"]
    image: nexora-core-data:${NEXORA_IMAGE_TAG:-p09-local}
    build:
      context: ..
      dockerfile: services/core-data/Dockerfile
    command: ["node", "files/scan-job.mjs"]
    environment:
      CORE_DATABASE_URL: ${CORE_DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_SCANNER_ACCESS_KEY: ${S3_SCANNER_ACCESS_KEY}
      S3_SCANNER_SECRET_KEY: ${S3_SCANNER_SECRET_KEY}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE}
      S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE}
      S3_BUCKET_PUBLIC: ${S3_BUCKET_PUBLIC}
      S3_REGION: ${S3_REGION}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy
      clamav:
        condition: service_started
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 512m

  dx-lab:
    profiles: ["dxlab"]
    image: nexora-dx-lab:${NEXORA_IMAGE_TAG:-p11-local}
    build:
      context: ..
      dockerfile: apps/dx-lab/Dockerfile
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_BASE_URL: ${OIDC_BASE_URL}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL}
      OIDC_CLIENT_ID_DXLAB: ${OIDC_CLIENT_ID_DXLAB}
      OIDC_REDIRECT_URI_DXLAB: ${OIDC_REDIRECT_URI_DXLAB}
      GATEWAY_INTERNAL_URL: http://gateway:9080
      DXLAB_SESSION_SECRET: ${DXLAB_SESSION_SECRET:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/dxlab/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 512m

  ai:
    profiles: ["ai"]
    image: nexora-ai:${NEXORA_IMAGE_TAG:-p10-local}
    build:
      context: ..
      dockerfile: services/ai/Dockerfile
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_MODEL: ${AI_MODEL:-qwen3:0.6b}
      AI_MODEL_BASE_URL: ${AI_MODEL_BASE_URL:-http://ollama:11434}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-}
      AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-30}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-256}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 256m

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.40.18@sha256:1cabd20e1762a7a8444bf4a7110b346d923cd77ab6c97c984434140638c913ec
    volumes:
      - ollama_models:/root/.ollama
    networks: [internal]
    deploy:
      resources:
        limits:
          memory: 2g

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules.yml:/etc/prometheus/rules.yml:ro
    networks: [internal]
    depends_on:
      - erp
      - worker
    deploy:
      resources:
        limits:
          memory: 512m

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-nexora-demo}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [internal]
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256m

  # local-admin host publishes: use overlay deploy/compose.local-admin.yml
  # (Compose v5 rejects ports on network_mode: service:* sidecars).
