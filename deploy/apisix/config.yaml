# APISIX standalone data plane (D01). OIDC route bodies live in routes.yaml.
# P02-T06: HTTP 9080 + HTTPS port 9443 published; SSL certs optional for local smoke.
apisix:
  node_listen:
    - 9080
    - 9443
  enable_http2: true
  enable_admin: false

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

# Log only allowlisted fields; never log headers, query strings or request bodies.
nginx_config:
  http:
    access_log_format: '{"service":"gateway","requestId":"$request_id","correlationId":"$upstream_http_x_request_id","status":$status,"path":"$uri","method":"$request_method"}'
    access_log_format_escape: json
  client_max_body_size: "10m"
