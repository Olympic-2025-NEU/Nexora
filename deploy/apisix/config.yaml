apisix:
  node_listen: 9080
  enable_admin: false

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

# Log only allowlisted fields; never log headers, query strings or request bodies.
nginx_config:
  http:
    access_log_format: '{"service":"gateway","requestId":"$request_id","correlationId":"$upstream_http_x_request_id","status":$status,"path":"$uri"}'
    access_log_format_escape: json
