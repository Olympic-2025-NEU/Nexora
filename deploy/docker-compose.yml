name: nexora

services:
  postgres:
    container_name: nexora-postgres
    image: postgres:17.6
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - nexora_pg:/var/lib/postgresql/data
      # Empty legacy SQL kept for now; Prisma Migrate is the real schema source (D03).
      - ../db/migrations/0001_platform.sql:/docker-entrypoint-initdb.d/0001_platform.sql:ro

volumes:
  nexora_pg:
    name: nexora_pg
