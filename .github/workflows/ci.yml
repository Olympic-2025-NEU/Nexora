name: ci

on:
  push:
    branches: [develop, main, "chore/**", "spike/**", "phase-*/**", "phase01/**", "phase-03", "phase03/**"]
  pull_request:
    branches: [develop, main]

jobs:
  platform-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install and generate Prisma client
        run: npm ci && npm run db:generate
      - name: PostgreSQL schema, privilege, upgrade and restore tests
        run: npm run test:platform:schema

  platform-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install and generate Prisma client
        run: npm ci && npm run db:generate
      - name: PostgreSQL Unit of Work failure and concurrency tests
        run: npm run test:platform:transaction

  platform-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install and generate Prisma client
        run: npm ci && npm run db:generate
      - name: PostgreSQL audit atomicity, privacy and query tests
        run: npm run test:platform:audit

  platform-files:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install and generate Prisma client
        run: npm ci && npm run db:generate
      - name: PostgreSQL and SeaweedFS file API, privacy, compensation and restart tests
        run: npm run test:platform:files

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Prisma generate
        run: npm run db:generate
      - name: Build
        run: npm run build
      - name: Typecheck (after Next typegen)
        run: npm run typecheck
      - name: Provenance, secrets and static contracts
        run: npm test

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build ERP image
        run: docker build -t nexora-erp:ci -f Dockerfile .
      - name: Build core-data image
        run: docker build -t nexora-core-data:ci -f services/core-data/Dockerfile .

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history including deploy config and scripts
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 \
            git /repo --redact --no-banner --gitleaks-ignore-path /repo/.gitleaksignore
